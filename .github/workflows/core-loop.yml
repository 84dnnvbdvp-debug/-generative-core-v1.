name: Autonomous Core Decision Engine

on:
  schedule:
    - cron: '0 */6 * * *'
  issues:
    types: [opened, labeled]
  workflow_dispatch:

# Strict concurrency control: prevents race conditions across parallel runs
concurrency:
  group: core-decision-engine
  cancel-in-progress: false

jobs:
  run-core-loop:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Core Decision Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python core_logic.py

      - name: Persist Core State to Git
        run: |
          git config user.name "generative-core-bot"
          git config user.email "bot@generative-core.local"
          git add core_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(state): update core_state.json [skip ci]" && git push)